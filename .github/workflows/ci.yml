name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_DB: gopay_test
          POSTGRES_USER: gopay
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gopay -d gopay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Tests that log through config.App() connect with these; the database is the throwaway service above.
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: gopay
      DB_PASS: testpassword
      DB_NAME: gopay_test
      DB_ZONE: UTC

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Load database schema
      env:
        PGPASSWORD: testpassword
      run: |
        psql -h localhost -U gopay -d gopay_test -v ON_ERROR_STOP=1 -q -f gopay.sql
        psql -h localhost -U gopay -d gopay_test -v ON_ERROR_STOP=1 -q -f .github/ci-seed.sql

    - name: Run unit tests
      run: go test -v -race ./...

    # Integration tests call real provider sandboxes and run by hand with -tags integration;
    # here they only have to keep compiling.
    - name: Vet integration tests
      run: go vet -tags integration ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    # Only issues introduced by the change fail the job; the existing backlog is tracked separately.
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.13
        only-new-issues: true
        args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build application
      run: |
        mkdir -p bin
        CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -ldflags="-s -w" -o bin/gopay ./cmd/main.go

    - name: Build for multiple platforms
      run: |
        # Build for Linux AMD64
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo -ldflags="-s -w" -o bin/gopay-linux-amd64 ./cmd/main.go
        
        # Build for Linux ARM64
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -a -installsuffix cgo -ldflags="-s -w" -o bin/gopay-linux-arm64 ./cmd/main.go
        
        # Build for macOS AMD64
        CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -a -installsuffix cgo -ldflags="-s -w" -o bin/gopay-darwin-amd64 ./cmd/main.go
        
        # Build for macOS ARM64
        CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -a -installsuffix cgo -ldflags="-s -w" -o bin/gopay-darwin-arm64 ./cmd/main.go

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gopay-binaries
        path: bin/

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max 