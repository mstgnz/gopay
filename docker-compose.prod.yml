services:
  # Load Balancer - Routes traffic to API replicas
  nginx:
    image: nginx:alpine
    container_name: gopay-nginx
    restart: always
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - gopay

  # API Service (will be scaled manually)
  api:
    build:
      context: .
      dockerfile: dockerfile
    image: gopay:latest
    restart: always
    # Docker allows 10s between SIGTERM and SIGKILL by default, which is not enough to finish a
    # payment that is already at the provider. The app drains for SHUTDOWN_TIMEOUT_SECONDS
    # (25s), so the container has to be allowed to live at least that long plus a margin.
    stop_grace_period: 40s
    deploy:
      mode: replicated
      replicas: 3
    expose:
      - "${APP_PORT}"
    env_file:
      - .env
    networks:
      - gopay
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  gopay:
    name: gopay
    driver: bridge
